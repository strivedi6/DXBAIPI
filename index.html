<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Business Bay Team</title>
<meta name="theme-color" content="#13294B">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="DXBAIPI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DXBAIPI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/HiltonSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/HiltonSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Set light or dark before the page draws, so it never flashes the wrong colour.
  (function () { try { var a = JSON.parse(localStorage.getItem('bb_appearance')) || 'auto';
    var d = a === 'dark' || (a === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    if (d) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F131A'); } catch (e) {} })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Please turn on JavaScript to use this app.</noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
